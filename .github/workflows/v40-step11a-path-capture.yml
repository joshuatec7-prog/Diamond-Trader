name: v4.0 step 11A path capture

on:
  workflow_dispatch:
  push:
    branches:
      - clean-room-20260826
    paths:
      - "research/v40_step11a_path_capture.py"
      - ".github/workflows/v40-step11a-path-capture.yml"

jobs:
  capture-development-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned research environment
        run: python -m pip install -r research/requirements-research.txt

      - name: Preflight compile and imports
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile research/v40_step11a_path_capture.py
          PYTHONPATH=. python - <<'PY'
          import research.v40_step11a_path_capture
          from bitvavo_public import BitvavoPublic
          print("step 11A imports OK")
          PY

      - name: Preflight download frozen datasets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -o bear.zip \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10498130810/zip"
          curl -L --fail \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -o range.zip \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10508180818/zip"
          unzip -tq bear.zip
          unzip -tq range.zip
          mkdir -p bear range
          unzip -q bear.zip -d bear
          unzip -q range.zip -d range
          test -s bear/cryptobot_v40_bear_research_dataset.json
          test -s range/cryptobot_v40_range_research_dataset.json
          python - <<'PY'
          import json
          for p in (
              "bear/cryptobot_v40_bear_research_dataset.json",
              "range/cryptobot_v40_range_research_dataset.json",
          ):
              d=json.load(open(p,encoding="utf-8"))
              assert d["rows"]
              assert d["period"]["signal_start_ms"] < d["period"]["signal_end_ms_exclusive"]
          print("step 11A artifact preflight OK")
          PY

      - name: Preflight public 5m API
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          from bitvavo_public import BitvavoPublic
          api=BitvavoPublic("https://api.bitvavo.com/v2", timeout_seconds=15, retries=3)
          rows=api.candles("BTC-EUR","5m",3)
          assert len(rows) >= 2
          assert all(c.is_valid for c in rows)
          print("step 11A public 5m API OK")
          PY

      - name: Run Step 11A path capture
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python research/v40_step11a_path_capture.py \
            bear/cryptobot_v40_bear_research_dataset.json \
            range/cryptobot_v40_range_research_dataset.json \
            --output v40_step11a_path_capture_result.json \
            | tee v40_step11a_path_capture.log

      - name: Validate research safety and split guards
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open("v40_step11a_path_capture_result.json",encoding="utf-8"))
          assert r["mode"]=="OFFLINE_MEASUREMENT_ONLY"
          assert r["execution_enabled"] is False
          assert r["live_orders_possible"] is False
          assert r["active_paper_changed"] is False
          assert r["new_untouched_test"] is False
          assert r["days_60_plus_used"] is False
          assert r["step5_6_validation_reused"] is False
          assert r["final15_reused"] is False
          assert r["path_interval"]=="5m"
          assert len(r["events"]) == r["sample"]["usable"]
          assert r["decision"] in (
              "PATH_DATASET_READY_FOR_STEP11B",
              "PATH_CAPTURE_DIAGNOSTIC_INSUFFICIENT_COVERAGE",
          )
          if r["decision"] == "PATH_DATASET_READY_FOR_STEP11B":
              assert r["sample"]["usable_pct"] >= r["sample"]["required_usable_pct"]
              assert r["sample"]["coverage_ready_for_step11b"] is True
          else:
              assert r["sample"]["usable_pct"] < r["sample"]["required_usable_pct"]
              assert r["sample"]["coverage_ready_for_step11b"] is False
          print("step 11A safety/split guards OK; research decision =", r["decision"])
          PY

      - name: Write summary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          r=json.load(open("v40_step11a_path_capture_result.json",encoding="utf-8"))
          print("# Step 11A — development path capture")
          print()
          print(f"- Beslissing: {r['decision']}")
          print(f"- Bruikbaar: {r['sample']['usable']}/{r['sample']['requested']} ({r['sample']['usable_pct']:.1f}%)")
          for state in ("SHORT","RANGE"):
              d=r["descriptive"][state]
              print(f"- {state}: n={d['n']} | MFE median={d['mfe_gross_pct']['median']} | MAE median={d['mae_gross_pct']['median']} | time-to-MFE median={d['time_to_mfe_min']['median']}")
          print(f"- Foutcategorieën: {r['sample']['error_category_counts']}")
          print(f"- Dekking per state/window: {r['sample']['group_coverage']}")
          print("- Dag 60+, Step5/6 validation en final15 niet gebruikt")
          print("- Nog geen exit/stop/runner-regel gekozen")
          PY

      - name: Upload Step 11A path dataset
        uses: actions/upload-artifact@v4
        with:
          name: cryptobot-v40-step11a-path-capture
          path: |
            v40_step11a_path_capture_result.json
            v40_step11a_path_capture.log
          retention-days: 14
