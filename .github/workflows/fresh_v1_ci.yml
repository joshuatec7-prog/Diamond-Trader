name: Fresh v1 CI

on:
  push:
    branches:
      - fresh-start-20260826
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python 3.12.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.14"

      - name: Install
        run: python -m pip install -r fresh_v1/requirements.txt

      - name: Unit tests
        working-directory: fresh_v1
        run: python -m unittest discover -s tests -v

      - name: Compile check
        working-directory: fresh_v1
        run: python -m compileall -q .

      - name: Config validation
        working-directory: fresh_v1
        run: python -c "from config import Settings; Settings().validate(); print('CONFIG PASS')"

      - name: CLI and SQLite smoke check
        working-directory: fresh_v1
        env:
          DB_PATH: /tmp/cryptobot_fresh_ci.db
        run: python main.py --status
