name: v4.0 master research dataset

on:
  workflow_dispatch:
  push:
    branches:
      - clean-room-20260826
    paths:
      - "v40_master_research_dataset.py"
      - "tests/test_v40_master_research_dataset.py"
      - ".github/workflows/v40-master-research-dataset.yml"

jobs:
  export-master-dataset:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test master dataset helpers
        run: python -m unittest tests.test_v40_master_research_dataset -v
      - name: Export exact 90-day master dataset
        run: |
          python v40_master_research_dataset.py --days 90 --output cryptobot_v40_master_research_dataset.json | tee cryptobot_v40_master_research_dataset.log
      - name: Validate safety and reusable labels
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("cryptobot_v40_master_research_dataset.json")
          report = json.loads(path.read_text(encoding="utf-8"))
          assert report["mode"] == "OFFLINE_MEASUREMENT_ONLY"
          assert report["execution_enabled"] is False
          assert report["live_orders_possible"] is False
          assert report["active_paper_changed"] is False
          assert report["future_data_used_for_features"] is False
          assert report["future_data_used_for_labels"] is True
          assert report["period"]["signal_days"] == 90
          assert report["period"]["purge_required_at_split_boundaries"] is True
          assert report["candidates"] > 0
          required_horizons = {"15", "60", "240", "480", "720", "1440", "2160", "2880"}
          for row in report["rows"]:
              assert required_horizons == set(row["forward_labels"])
              assert all(label["mature"] == 1 for label in row["forward_labels"].values())
              assert row["barrier_label_48h"]["outcome"] in {"STOP", "TARGET", "TIME"}
              assert row["market_context"]["markets_used"] > 0
              assert row["cross_section"]["simultaneous_candidate_count"] > 0
          print("master dataset validation OK")
          PY
      - name: Write summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from datetime import datetime, timezone
          report = json.load(open("cryptobot_v40_master_research_dataset.json", encoding="utf-8"))
          print("# v4.0 master research dataset")
          print()
          print(f"- Resultaat: gereed {datetime.now(timezone.utc).isoformat()}")
          print(f"- Markten: {report['markets_completed']}/{report['markets_requested']}")
          print(f"- Kandidaten: {report['candidates']}")
          print(f"- Onvolledige labels/context verwijderd: {report['candidates_dropped_incomplete_labels_or_context']}")
          print(f"- Vroege features: {len(report['early_feature_set'])}")
          print(f"- Marktcontextvelden: {len(report['market_context_set'])}")
          print(f"- Cross-sectionvelden: {len(report['cross_section_set'])}")
          print("- Signalen: exact 90 dagen; laatste 48 uur uitsluitend labelstaart")
          print("- Uitvoering: UIT / OFFLINE MEASUREMENT ONLY")
          print("- Render/PAPER/live: niet gewijzigd")
          PY
      - name: Upload master dataset
        uses: actions/upload-artifact@v4
        with:
          name: cryptobot-v40-master-research-dataset
          path: |
            cryptobot_v40_master_research_dataset.json
            cryptobot_v40_master_research_dataset.log
          retention-days: 14
