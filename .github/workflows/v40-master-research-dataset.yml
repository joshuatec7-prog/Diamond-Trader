name: v4.0 master research dataset

on:
  workflow_dispatch:
  push:
    branches:
      - clean-room-20260826
    paths:
      - "v40_master_research_dataset.py"
      - "tests/test_v40_master_research_dataset.py"
      - ".github/workflows/v40-master-research-dataset.yml"

jobs:
  export-master-dataset:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test master dataset helpers
        run: python -m unittest tests.test_v40_master_research_dataset -v
      - name: Export exact 90-day master dataset
        run: |
          python v40_master_research_dataset.py --days 90 --output cryptobot_v40_master_research_dataset.json | tee cryptobot_v40_master_research_dataset.log
      - name: Add short BTC context robustly
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from bitvavo_public import BitvavoPublic

          FIVE = 300_000
          path = Path("cryptobot_v40_master_research_dataset.json")
          report = json.loads(path.read_text(encoding="utf-8"))
          period = report["period"]
          api = BitvavoPublic("https://api.bitvavo.com/v2", timeout_seconds=20, retries=4)

          btc = api.closed_candles_between(
              "BTC-EUR", "5m",
              int(period["fetch_start_ms"]), int(period["fetch_end_ms"]),
              now_ms=int(period["fetch_end_ms"]),
          )
          closes = {int(c.timestamp_ms): float(c.close) for c in btc if c.is_valid}

          def pct(new, old):
              return (new / old - 1.0) * 100.0 if new > 0 and old > 0 else 0.0

          def complete(ts):
              needed = [ts, ts - FIVE, ts - 2 * FIVE, ts - 3 * FIVE, ts - 12 * FIVE]
              return all(item in closes for item in needed)

          signal_times = sorted({int(row["signal_ms"]) for row in report["rows"]})
          missing = [ts for ts in signal_times if not complete(ts)]

          # Een brede historische API-call kan incidenteel één candle missen.
          # Haal dan uitsluitend een klein BTC-venster opnieuw op; geen EUR-markt wordt opnieuw gefetcht.
          for ts in missing:
              retry = api.closed_candles_between(
                  "BTC-EUR", "5m",
                  ts - 13 * FIVE, ts + FIVE,
                  now_ms=ts + FIVE,
              )
              for candle in retry:
                  if candle.is_valid:
                      closes[int(candle.timestamp_ms)] = float(candle.close)

          unresolved = {ts for ts in signal_times if not complete(ts)}
          if unresolved:
              before = len(report["rows"])
              report["rows"] = [row for row in report["rows"] if int(row["signal_ms"]) not in unresolved]
              removed = before - len(report["rows"])
              report["candidates"] = len(report["rows"])
              report["candidates_dropped_incomplete_labels_or_context"] = int(
                  report.get("candidates_dropped_incomplete_labels_or_context", 0)
              ) + removed
              report["notes"].append(
                  f"{removed} kandidaten op {len(unresolved)} tijdstip(pen) verwijderd omdat korte BTC-context na gerichte retry onvolledig bleef."
              )

          keys = [
              "btc_return_5m_pct", "btc_return_10m_pct",
              "btc_return_15m_pct", "btc_return_1h_pct",
          ]
          for row in report["rows"]:
              ts = int(row["signal_ms"])
              now = closes[ts]
              prior = [closes[ts - n * FIVE] for n in (1, 2, 3, 12)]
              values = [pct(now, value) for value in prior]
              for key, value in zip(keys, values):
                  row["market_context"][key] = round(value, 8)

          existing = list(report["market_context_set"])
          for key in keys:
              if key not in existing:
                  existing.append(key)
          report["market_context_set"] = existing
          report["notes"].append(
              "Korte BTC-context 5m/10m/15m/1u is point-in-time toegevoegd; ontbrekende brede-fetch candles krijgen eerst een gerichte BTC-only retry."
          )
          path.write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8")
          print(f"short BTC context added; unresolved timestamps removed: {len(unresolved)}")
          PY
      - name: Validate safety and reusable labels
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("cryptobot_v40_master_research_dataset.json")
          report = json.loads(path.read_text(encoding="utf-8"))
          assert report["mode"] == "OFFLINE_MEASUREMENT_ONLY"
          assert report["execution_enabled"] is False
          assert report["live_orders_possible"] is False
          assert report["active_paper_changed"] is False
          assert report["future_data_used_for_features"] is False
          assert report["future_data_used_for_labels"] is True
          assert report["period"]["signal_days"] == 90
          assert report["period"]["purge_required_at_split_boundaries"] is True
          assert report["candidates"] > 0
          required_horizons = {"15", "60", "240", "480", "720", "1440", "2160", "2880"}
          btc_keys = {"btc_return_5m_pct", "btc_return_10m_pct", "btc_return_15m_pct", "btc_return_1h_pct"}
          for row in report["rows"]:
              assert required_horizons == set(row["forward_labels"])
              assert all(label["mature"] == 1 for label in row["forward_labels"].values())
              assert row["barrier_label_48h"]["outcome"] in {"STOP", "TARGET", "TIME"}
              assert row["market_context"]["markets_used"] > 0
              assert btc_keys.issubset(row["market_context"])
              assert row["cross_section"]["simultaneous_candidate_count"] > 0
          print("master dataset validation OK")
          PY
      - name: Write summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from datetime import datetime, timezone
          report = json.load(open("cryptobot_v40_master_research_dataset.json", encoding="utf-8"))
          print("# v4.0 master research dataset")
          print()
          print(f"- Resultaat: gereed {datetime.now(timezone.utc).isoformat()}")
          print(f"- Markten: {report['markets_completed']}/{report['markets_requested']}")
          print(f"- Kandidaten: {report['candidates']}")
          print(f"- Onvolledige labels/context verwijderd: {report['candidates_dropped_incomplete_labels_or_context']}")
          print(f"- Vroege features: {len(report['early_feature_set'])}")
          print(f"- Marktcontextvelden incl. korte BTC: {len(report['market_context_set'])}")
          print(f"- Cross-sectionvelden: {len(report['cross_section_set'])}")
          print("- Signalen: exact 90 dagen; laatste 48 uur uitsluitend labelstaart")
          print("- Uitvoering: UIT / OFFLINE MEASUREMENT ONLY")
          print("- Render/PAPER/live: niet gewijzigd")
          PY
      - name: Upload master dataset
        uses: actions/upload-artifact@v4
        with:
          name: cryptobot-v40-master-research-dataset
          path: |
            cryptobot_v40_master_research_dataset.json
            cryptobot_v40_master_research_dataset.log
          retention-days: 14
