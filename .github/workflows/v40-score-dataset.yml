name: v4.0 score calibration dataset

on:
  workflow_dispatch:
  push:
    branches:
      - clean-room-20260826
    paths:
      - v40_score_dataset_export.py
      - tests/test_v40_score_dataset_export.py
      - .github/workflows/v40-score-dataset.yml

permissions:
  contents: read

jobs:
  export-score-dataset:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run 90-day market-wide measurement export
        run: |
          python -u v40_score_dataset_export.py \
            --days 90 \
            --output cryptobot_v40_score_dataset.json \
            | tee cryptobot_v40_score_dataset.log

      - name: Validate safety and dataset
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('cryptobot_v40_score_dataset.json').read_text())
          assert report['execution_enabled'] is False
          assert report['live_orders_possible'] is False
          assert report['active_paper_changed'] is False
          assert report['component'] == 'V40_SCORE_CALIBRATION_DATASET'
          assert report['candidates'] == len(report['rows'])
          print('Safety and dataset validation OK')
          PY

      - name: Write summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          report = json.loads(Path('cryptobot_v40_score_dataset.json').read_text())
          print('## v4.0 score-calibratie dataset')
          print(f"- Markten: {report['markets_completed']}/{report['markets_requested']}")
          print(f"- Kandidaten: {report['candidates']}")
          print(f"- Dataproblemen: {len(report['errors'])}")
          print('- Alleen meetdata; actieve PAPER-bot ongewijzigd; live orders onmogelijk.')
          PY

      - name: Upload dataset
        uses: actions/upload-artifact@v4
        with:
          name: cryptobot-v40-score-dataset
          path: |
            cryptobot_v40_score_dataset.json
            cryptobot_v40_score_dataset.log
          retention-days: 14
