name: v4.0 soft memory challenger

on:
  workflow_dispatch:
  push:
    branches:
      - clean-room-20260826
    paths:
      - v40_soft_memory_lab.py
      - tests/test_v40_soft_memory_lab.py
      - .github/workflows/v40-soft-memory-challenger.yml

permissions:
  contents: read

jobs:
  soft-memory-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run 90-day market-wide A/B replay
        run: |
          python -u v40_soft_memory_lab.py \
            --days 90 \
            --output cryptobot_v40_soft_memory_challenger.json \
            | tee cryptobot_v40_soft_memory_challenger.log

      - name: Validate safety and report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('cryptobot_v40_soft_memory_challenger.json').read_text())
          assert report['execution_enabled'] is False
          assert report['live_orders_possible'] is False
          comparison = report['comparison']
          assert comparison['active_paper_changed'] is False
          assert comparison['execution_enabled'] is False
          assert comparison['live_orders_possible'] is False
          assert comparison['change']['special_market_exceptions'] is False
          assert comparison['one_change_only'] is True
          print('Safety validation OK')
          PY

      - name: Write summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          report = json.loads(Path('cryptobot_v40_soft_memory_challenger.json').read_text())
          comparison = report['comparison']
          hard = comparison['hard_memory_control']
          soft = comparison['soft_memory_challenger']
          hard_full = hard['full_period']
          soft_full = soft['full_period']

          print('## v4.0 marktbrede soft-memory challenger')
          print(f"- Markten: {report['markets_completed']}/{report['markets_requested']}")
          print(f"- Signalen: {report['signals']}")
          print(f"- Hard memory: {hard['desk_selected']} geselecteerd | {hard_full['trades']} trades | EUR {hard_full['total_result_eur']:.2f} | PF {hard_full['profit_factor']}")
          print(f"- Soft memory: {soft['desk_selected']} geselecteerd | {soft_full['trades']} trades | EUR {soft_full['total_result_eur']:.2f} | PF {soft_full['profit_factor']}")
          print(f"- Kandidaten met geheugenstraf: {soft['memory_penalty_count']}")
          print(f"- Verschil resultaat: EUR {comparison['comparison']['soft_minus_hard_total_result_eur']:.2f}")
          print(f"- Besluit: {comparison['decision']}")
          print('- Alle markten worden gelijk behandeld; geen munt-specifieke uitzonderingen.')
          print('- Alleen negatief geheugen verandert van hard veto naar -12 confidence; overige harde veiligheidsregels blijven staan.')
          PY

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: cryptobot-v40-soft-memory-challenger
          path: |
            cryptobot_v40_soft_memory_challenger.json
            cryptobot_v40_soft_memory_challenger.log
          retention-days: 14
