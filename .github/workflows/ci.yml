name: Clean-room CI

on:
  push:
    branches:
      - clean-room-20260826
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.14'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q .
      - run: python -c "from config import Settings; Settings().validate(); print('config OK')"
      - run: python offline_check.py
      - run: DB_PATH=/tmp/cleanroom-ci.db python readiness.py

