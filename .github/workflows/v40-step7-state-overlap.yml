name: v4.0 step 7 state overlap

on:
  workflow_dispatch:
  push:
    branches:
      - clean-room-20260826
    paths:
      - "research/v40_step7_state_overlap.py"
      - ".github/workflows/v40-step7-state-overlap.yml"

jobs:
  analyze-state-overlap:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Download frozen Step 5 and Step 6 datasets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -L --fail \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -o bear.zip \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10498130810/zip"
          curl -L --fail \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -o range.zip \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10508180818/zip"
          mkdir -p bear range
          unzip -q bear.zip -d bear
          unzip -q range.zip -d range
      - name: Run Step 7 overlap and state analysis
        run: |
          python research/v40_step7_state_overlap.py \
            bear/cryptobot_v40_bear_research_dataset.json \
            range/cryptobot_v40_range_research_dataset.json \
            --output v40_step7_state_overlap_result.json \
            | tee v40_step7_state_overlap.log
      - name: Validate research safety
        run: |
          python - <<'PY'
          import json
          r=json.load(open('v40_step7_state_overlap_result.json',encoding='utf-8'))
          assert r['mode']=='OFFLINE_MEASUREMENT_ONLY'
          assert r['execution_enabled'] is False
          assert r['live_orders_possible'] is False
          assert r['active_paper_changed'] is False
          assert r['new_untouched_test'] is False
          assert r['long_state']['enabled'] is False
          print('step 7 safety OK')
          PY
      - name: Write summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          r=json.load(open('v40_step7_state_overlap_result.json',encoding='utf-8'))
          print('# Step 7 LONG / SHORT / RANGE / NO TRADE')
          print()
          print(f"- SHORT selecties: {r['selected_counts']['short']}")
          print(f"- RANGE selecties: {r['selected_counts']['range']}")
          print(f"- Zelfde momenten: {r['overlap']['same_moment_count']}")
          print(f"- Exact dezelfde markt: {r['overlap']['exact_same_market_count']}")
          print(f"- RANGE_LONG aandeel: {r['overlap']['range_long_share_pct']:.2f}%")
          for state,m in r['frozen_state_arbiter']['states'].items():
              print(f"- {state}: n={m['n']} mean={m['mean_pct']} PF={m['pf']}")
          print('- LONG blijft uit: Step 4 faalde')
          print('- Dit is diagnostiek; geen nieuwe untouched test')
          PY
      - name: Upload Step 7 result
        uses: actions/upload-artifact@v4
        with:
          name: cryptobot-v40-step7-state-overlap
          path: |
            v40_step7_state_overlap_result.json
            v40_step7_state_overlap.log
          retention-days: 14
