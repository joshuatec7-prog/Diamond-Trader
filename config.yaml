# Diamond Trader configuratie
# Echte LONGs vereisen altijd een geldige fail-closed approval.
# De paper-shorttest gebruikt strategie short_breakout_v3.
# Shorts blijven paper-only; echte LONGs gaan alleen via approval + safety gates.

quote: EUR
timeframe: 15m

symbols:
  - BTC/EUR
  - ETH/EUR
  - SOL/EUR
  - XRP/EUR
  - ADA/EUR

trading:
  # Spot LONG-route actief achter approval en safety gates.
  enable_spot: true

  # Alleen gesimuleerde shortposities.
  enable_short_signals: true

  # Nooit tegelijk long en short op dezelfde munt.
  allow_long_and_short_same_symbol: false

  # Longs en paper-shorts samen.
  max_total_positions: 5

risk:
  dry_run: false
  fixed_stake_quote: 130
  max_open_positions: 1
  eur_reserve: 250

  # Canary blijft hard begrensd op €30.
  canary_hard_max_stake_quote: 30.0

  # Normale LIVE-modus kan nooit boven €130 per trade.
  live_hard_max_stake_quote: 130.0
  max_spread_pct: 0.25
  min_profit_eur: 0.50
  cooldown_minutes: 240
  skip_log_every_seconds: 600

  # Handmatig bezit wordt nooit door de bot verkocht.
  avoid_symbols_with_existing_balance: false
  existing_balance_dust: 0.00000001

  # Alleen gebruikt voor de dry-run simulatie van spotposities.
  simulated_quote_balance: 3000

fees:
  taker_fee_pct: 0.25

signals:
  use_sma: true
  sma_fast: 20
  sma_slow: 60
  require_crossover: true

  use_rsi: true
  rsi_len: 14
  rsi_buy_min: 55
  rsi_buy_max: 70

  use_atr_filter: true
  atr_len: 14
  min_atr_pct: 0.30

  atr_tp_mult: 2.6
  atr_sl_mult: 1.2
  hard_stop_loss_pct: 3.0

  trailing_enabled: true
  trailing_atr_mult: 1.2
  profit_trailing_trigger_pct: 1.0
  profit_trailing_pullback_pct: 0.5
  exit_on_trend_break: true

scanner:
  auto_scan: false
  top_n_markets: 20
  min_quote_volume: 250000

  exclude_bases:
    - EUR
    - USDT
    - USDC
    - DAI

news:
  enabled: false
  timespan_hours: 24
  top_n_for_news_check: 3
  min_news_score_to_buy: 0.0
  bad_news_score_to_exit: -1.5
  allow_buy_without_news: true
  fail_open: true
  block_on_severe_negative: true
  force_exit_on_severe_negative: false
  use_fear_greed: false
  fear_greed_buy_max: 75
  max_records: 100

short:
  # Altijd uitsluitend een papieren simulatie.
  enabled: true
  paper_only: true
  strategy_version: short_breakout_v3

  # Eerste test: maximaal één short zonder hefboom.
  max_open_positions: 1
  leverage: 1
  margin_per_trade: 30
  min_profit_eur: 0.05
  cooldown_minutes: 240
  test_target_trades: 20

  use_sma: true
  sma_fast: 20
  sma_slow: 60

  # Instap bij een nieuwe bearish kruising OF bij een nieuwe
  # neerwaartse uitbraak binnen een bestaande dalende trend.
  allow_crossover_entry: true
  allow_breakout_entry: true
  breakout_lookback_candles: 8
  require_fast_sma_falling: true

  # Niet shorten wanneer RSI al extreem oversold is.
  use_rsi: true
  rsi_len: 14
  rsi_sell_min: 25
  rsi_sell_max: 45

  use_atr_filter: true
  atr_len: 14
  min_atr_pct: 0.30
  atr_tp_mult: 2.4
  atr_sl_mult: 1.2

  # V3: kostenbewuste netto risico/winstcontrole.
  # Het TP-doel wordt zo nodig verder gezet; is meer dan 4 ATR nodig,
  # dan wordt de instap veilig overgeslagen.
  min_net_reward_risk: 1.00
  max_cost_adjusted_tp_atr_mult: 4.0

  # V3: exits worden uitsluitend na een afgesloten candle beoordeeld,
  # maar high/low bepalen of TP of SL binnen die candle is geraakt.
  # Wanneer beide zijn geraakt, telt conservatief de stop-loss.
  use_intrabar_thresholds: true
  simulate_threshold_execution: true
  paper_slippage_pct: 0.0

files:
  state_file: /var/data/diamond_state.json
  trades_file: /var/data/diamond_transactions.csv
  control_file: /var/data/diamond_control.json
  short_test_baseline_file: /var/data/diamond_short_test_baseline.json
  short_test_report_file: /var/data/diamond_short_test_report.json
  short_execution_file: /var/data/diamond_short_execution.csv
  short_test_archive_dir: /var/data/short_test_archive

execution:
  selective_contracts_enabled: true

  # Normale LIVE-modus wordt pas toegelaten nadat
  # minimaal 5 echte canary-trades zijn afgerond.
  live_mode_enabled: true
  require_canary_graduation_trades: 5

  # Voorlopig maximaal één nieuwe LIVE BUY per handmatige approval.
  live_max_entries_per_approval: 1

  # Fail-closed orderboekcontrole voor nieuwe echte LONG BUYs.
  liquidity_gate_enabled: true
  liquidity_orderbook_depth: 50

  # Geschatte VWAP-impact van een market BUY mag maximaal 0.15% zijn.
  liquidity_max_price_impact_pct: 0.15

  # Binnen 0.25% boven de beste ask moet minimaal 2x de
  # geplande inzet aan zichtbare ask-liquiditeit liggen.
  liquidity_depth_band_pct: 0.25
  liquidity_min_depth_multiple: 2.0

  # Open echte LONG-posities worden tussen de zware
  # strategiecycli door met actuele bid-prijs bewaakt.
  position_check_seconds: 20

logging:
  level: INFO
  loop_sleep_seconds: 300
  candles_limit: 400
